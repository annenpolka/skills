  - id: D-007
    scope: {ref: "app/renewal_worker.py:16, 57", version: "4f30341995ac"}
    layer: 細部
    origin: [deviation, impact]
    question: "どの前提を焼き込んでいる: タイムゾーンなしの datetime.now() と timestamptz の比較は、Pod の TZ と DB セッションの TimeZone の一致を前提にしていないか"
    current_answer: "Pod の現地時刻（TZ=Asia/Tokyo）をタイムゾーンなしのまま SQL に渡し、失敗時の再試行日も同じ値から作っている"
    grounding:
      - existing_contract: "app/monthly_worker.py:13 月額は datetime.now(timezone.utc)（タイムゾーン付き）で比較している"
    evidence:
