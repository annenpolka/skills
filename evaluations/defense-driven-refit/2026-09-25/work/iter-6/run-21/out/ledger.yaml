      reason: "購読1件ごとに例外を捕まえて記録し、次の購読へ進める。課金成立後の例外で同じ期間を再課金しないことは D-002 の鍵が担う（鍵が無いまま件ごとに続けると、DB 障害時に課金だけが進む）"
