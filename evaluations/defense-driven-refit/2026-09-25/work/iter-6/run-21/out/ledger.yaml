  - id: D-002
    scope: {ref: "app/renewal_worker.py:22-42, app/payments_client.py:17-43", version: "4f30341995ac"}
    layer: 境界
    origin: [impact, asked]
    simulated: true
    question: "誰の要求に遡れる: 要求2（同じ購読・同じ請求期間を二重に課金しない）を、成果物のどこが守っているか"
    current_answer: "守る仕組みは無い。課金の成功後に renews_at を進めて、次回の抽出から外しているだけ"
    grounding:
      - requirement: "docs/tickets/BILL-212.md:10 要求2"
      - existing_contract: "docs/vendor/payco-api-v2-excerpt.md:8 POST /v2/charges は Idempotency-Key ヘッダを受け付け、同じキーでの再送には最初の要求の結果を返す"
    evidence:
      - inspection: "app/payments_client.py:27-31 Idempotency-Key を送っていない"
      - inspection: "app/renewal_worker.py:28-42 と app/db.py:6（autocommit=True）: 課金と renews_at の更新は別々に確定する。課金の成立後・更新の前に止まると、購読は期日到来のまま残り、次の実行で再び課金される"
      - inspection: "docs/vendor/payco-api-v2-excerpt.md:10 5xx 応答では課金の成否が不定のことがある。成否不定も PaymentError として失敗扱いになり（app/payments_client.py:36-39, 43）、3日後に再課金される（app/renewal_worker.py:54-58）"
      - inspection: "deploy/scheduler.yaml:9, 12 RollingUpdate、terminationGracePeriodSeconds: 30。app/scheduler.py に終了シグナルの処理は無く、デプロイ時は処理中のループが途中で止まる（猶予後の強制終了は Kubernetes の Pod 終了の仕組みによる。該当する一次資料の文は今回取得できず、既有知識）"
    gap: "課金の成立と DB 更新の間での停止（デプロイ、UPDATE の失敗、D-012 の例外）や、成否不定の 5xx の後に、同じ請求期間を再び課金する経路が資料確認で成り立つ（要求2に反する）。PayCo に重複を判別させる鍵も、こちら側の課金試行の記録も無い。年額でこの経路に入るのは D-004 を直した後"
    resolution:
      action: change
      reason: "要求2は明文の要求で、PayCo には Idempotency-Key という既存契約がある。請求期間から決まる鍵を送れば、再抽出・成否不定の後の再試行・二重起動のいずれでも PayCo が最初の結果を返す（保持期間内）。鍵の作り方は D-014"
      candidate: false
    verification:
      status: pending
      plan: "charge に鍵を渡す引数を足し、Idempotency-Key ヘッダに載ることを単体テストで確認する。同じ購読・同じ請求期間では同じ鍵、期間が変われば別の鍵になることをテストする。SUP-4411 の回答で、保持期間が再送の最長間隔（成否不定から3日後の再試行まで）を覆うことを確認する"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit:
      limit: "鍵の保持期間が不明（docs/vendor/payco-api-v2-excerpt.md:9、SUP-4411 で問い合わせ中）。保持期間を過ぎた再送は PayCo 側で重複と判定されない"
      revisit_condition: "SUP-4411 の回答が届いたとき。保持期間が再送の最長間隔より短ければ、こちら側に課金試行の記録を持つか、GET /v2/charges（excerpt:12-14）で照合する方式へ広げる（照合に使える項目は抜粋に記載が無い）"
      kind: unverified
    depends_on: []

