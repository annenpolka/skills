  - id: D-004
    scope: {ref: "app/renewal_worker.py:5, 26", version: "4f30341995ac"}
    layer: 細部
    origin: [deviation, impact, asked]
    simulated: true
    question: "どの前提を焼き込んでいる: 金額を float の税率と round(…, 2) で出しているが、DB の price の型と PayCo の amount の形式を前提にできているか"
    current_answer: "price ×（1 + config.TAX_RATE）を小数2桁に丸め、その値を amount に渡している"
    grounding:
      - requirement: "docs/tickets/BILL-212.md:12 要求4 税込。通貨ごとの最小単位に丸める（JPY は1円、USD は1セント）"
      - existing_contract: "docs/vendor/payco-api-v2-excerpt.md:7 amount は通貨の最小単位の整数（JPY なら円、USD ならセント）"
      - existing_contract: "app/money.py:7-11 with_tax_minor_units（Decimal、ROUND_HALF_UP、最小単位の整数を返す）。app/monthly_worker.py:21 月額はこれを使う"
    evidence:
      - inspection: "migrations/0031_subscriptions.sql:6 price は numeric(12, 2)。psycopg 3 文書 Adapting basic Python types §Numbers adaptation: numeric は既定で Decimal として読まれる。app/db.py:6 は dict_row 以外の読み込み設定をしていない（抜粋内に numeric の読み込みを変える設定は無い）"
      - inspection: "app/config.py:3 TAX_RATE = 0.10（float）。Python 文書 decimal: Decimal は float と算術演算で組み合わせられず、TypeError になる（「an attempt to add a Decimal to a float, for example, will raise a TypeError」）"
      - inspection: "tests/test_renewal_worker.py:41 は price を float（12000.0）で与え、:59 は現在値 13200.0 を確かめている。本番の Decimal の経路も、最小単位の整数という要求も通っていない"
    gap: "本番では price が Decimal で読まれ、float との乗算で TypeError になり、年額の更新が1件も成立しない（例外の波及は D-005）。計算できたとしても、小数2桁の主単位の値を amount に渡しており、PayCo 契約の最小単位の整数と合わない（最小単位として解釈されれば USD は約100分の1の額。非整数を拒否するかは抜粋に記載が無い）"
    resolution:
      action: remove_or_align
      reason: "月額と同じ money.with_tax_minor_units に寄せる。最小単位の整数・Decimal・丸め方（ROUND_HALF_UP）を既存契約から継承できる。丸め方は要求に指定が無く、既存に合わせた"
      candidate: false
    verification:
      status: pending
      plan: "Decimal の price で amount が int になることをテストで確認する（JPY 12000.00 → 13200、USD 10.00 → 1100）。renewal_worker から config.TAX_RATE の float 計算が消えたことを差分で確認する"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit:
      limit: "money.MINOR_UNIT_EXPONENT は JPY と USD だけ（app/money.py:4）。年額購読に他の通貨があるかは資料に無く、あれば KeyError で止まる"
      revisit_condition: "年額購読の currency の分布を確認したとき、または通貨を追加するとき"
      kind: unverified
    depends_on: []

  - id: D-005
    scope: {ref: "app/renewal_worker.py:22-43, app/scheduler.py:9-14", version: "4f30341995ac"}
    layer: 手続き
    origin: [impact]
    question: "無いと何が壊れる: PaymentError 以外の例外が1件で起きたとき、残りの購読と、同じプロセスの既存ジョブはどうなるか"
    current_answer: "PaymentError だけを捕まえ、それ以外の例外は run_due_renewals の外へ出る"
    grounding:
      - requirement: "docs/tickets/BILL-212.md:9 要求1 期日を過ぎた active な年額購読を更新課金する（1件の不良で他の購読が更新されないのは要求1を満たさない）"
      - existing_contract: "app/scheduler.py:9 と app/cleanup.py:4-5 既存の purge_expired_sessions が同じプロセスで1時間ごとに動く"
    evidence:
      - inspection: "app/renewal_worker.py:34 捕まえるのは PaymentError だけ。例外の発生源の例: D-004 の TypeError（全件）、D-012 の ValueError、money の KeyError（D-004 の限界）、app/payments_client.py:41 の resp.json()（JSON でない 4xx 本文）"
      - inspection: "schedule 文書 Exception Handling「Schedule doesn't catch exceptions that happen during job execution ... will bubble up and interrupt schedule's run_xyz function」。app/scheduler.py:12-14 のループに例外処理は無く、プロセスが終了する"
      - inspection: "schedule 文書 Examples: every(n) の初回は登録から n 後（「Starting ... from now」）。掃除は起動1時間後が初回で、10分後の年額ジョブで落ち続ける限り実行されない"
    gap: "1件の例外で残りの購読が処理されない。scheduler では例外がループを抜けてプロセスが落ち、再起動と失敗を繰り返す間、同居する purge_expired_sessions まで実行されない。D-004 の TypeError は全件で起きるので、この経路は資料確認で成り立つ"
    resolution:
