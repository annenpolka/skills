      - requirement: "docs/tickets/BILL-212.md:10 要求2「同じ購読の同じ請求期間について二重に課金しない（利用規約 §4.2 に明記済み）」"
      - existing_contract: "deploy/monthly-worker.yaml:1-8 既存の課金ジョブ（月額）は単独プロセスの CronJob、concurrencyPolicy: Forbid で動かしている"
    evidence:
      - inspection: "deploy/scheduler.yaml:7 replicas: 2。app/scheduler.py:9-10 はモジュール読み込み時にジョブを登録するので、各レプリカがそれぞれ10分ごとに run_due_renewals を実行する"
      - inspection: "app/renewal_worker.py:17-21 期日到来の購読を条件だけで取得し、行の確保・ロック・処理中の印が無い。両レプリカが同じ購読を取得しうる"
      - inspection: "app/cleanup.py:4-5 既存の同居ジョブは期限切れセッションの DELETE で、2回実行されても結果が変わらない。2レプリカ構成はこの種のジョブで成り立っている"
      - inspection: "deploy/scheduler.yaml:8-9 RollingUpdate で maxSurge 未指定。Kubernetes 文書 Deployments §Rolling Update Deployment: maxSurge の既定は25%で切り上げ。2レプリカでは更新中に一時的に3つ目の Pod が動く"
    gap: "2つ（更新中は3つ）のプロセスが同じ期日到来購読を並行して課金し、同じ請求期間を二重に課金する経路が資料確認で成り立つ（要求2に反する）。3回目の失敗時の通知メールも重複しうる。現状は D-004 の例外で課金前に止まるため、年額でこの経路に入るのは D-004 を直した後"
    resolution:
