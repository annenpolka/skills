    scope: {ref: "deploy/scheduler.yaml:1-19, app/scheduler.py:7-14", version: "4f30341995ac"}
    layer: 構造
    origin: [deviation, impact]
    question: "なぜこの形: 年額更新を2レプリカで動く共用 scheduler に載せ、月額と同じ単独の CronJob（concurrencyPolicy: Forbid）にしないのはなぜか"
