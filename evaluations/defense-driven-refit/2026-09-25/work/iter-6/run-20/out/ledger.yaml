    scope: {ref: ["app/routes/account.py:9-11", "app/auth.py:1", "app/auth.py:19-27"], version: "sha256:96dc07b5b05d58a7ac86e70c984c6f46ab6ce1209f683dc4a5f9f8ab645f3d56"}
