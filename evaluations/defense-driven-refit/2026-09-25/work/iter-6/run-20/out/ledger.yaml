    verification:
      status: done
      plan: "削除対象の決め方と資格情報の渡し方を資料で確認する"
      result: "ID を受け取る入力は無い。Cookie を使わず、他サイトのページはトークンを知らないので、ブラウザが自動で付ける資格情報も無い（資料確認。実行はしていない）"
      artifact_version: "sha256:96dc07b5b05d58a7ac86e70c984c6f46ab6ce1209f683dc4a5f9f8ab645f3d56"
    final_answer: "削除できるのはトークンの持ち主自身のアカウントだけで、ID を差し替える入力はない。Cookie を使わない Bearer 認証なので、他サイトから資格情報付きの削除要求を送らせる前提が成り立たない"
