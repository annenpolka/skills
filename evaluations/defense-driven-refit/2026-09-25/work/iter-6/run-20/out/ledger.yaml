      - inspection: "app/auth.py:1, 19-27 — Authorization ヘッダの Bearer トークンを検証。Cookie は使わない"
      - inspection: "OWASP Cross-Site Request Forgery Prevention Cheat Sheet, Introduction — 攻撃はブラウザが Cookie を自動で付けることに依る（「browser requests automatically include all cookies including session cookies」）"
      - inspection: "同 Cheat Sheet, Employing Custom Request Headers for AJAX/API — カスタムヘッダ付きの要求はブラウザが preflight の対象にする"
    gap: null
