  - id: B-01
    scope: {ref: ["app/auth.py:9", "app/auth.py:19-27", "app/routes/account.py:9-12"], version: "sha256:96dc07b5b05d58a7ac86e70c984c6f46ab6ce1209f683dc4a5f9f8ab645f3d56"}
    layer: 境界
    origin: impact
    question: "どの前提を焼き込んでいる: 『削除後、その利用者はログインできない』は、発行済みのアクセストークンと、ログイン・トークン更新の経路について成り立つか"
    current_answer: "current_user は JWT の署名と形式だけを検証して users を引かないため、発行済みアクセストークンは削除後も最長24時間有効。refresh_tokens は ON DELETE CASCADE で同時に消える。抜粋のルートで残ったトークンができるのは空の注文一覧の取得と DELETE /v1/me の再実行（0件で204）で、profile 更新と注文作成は外部キー違反で失敗する。id は sequence 採番の bigserial で、同じ email で再登録した別アカウントに旧トークンの sub が当たることはない"
    grounding:
      - requirement: "docs/tickets/ACC-88.md:10 — 削除後、その利用者はログインできない"
    evidence:
      - inspection: "app/auth.py:9 — ACCESS_TOKEN_TTL_SECONDS = 24 * 60 * 60"
      - inspection: "app/auth.py:19-27 — 署名検証のみで、利用者の存在を DB で確かめない"
      - inspection: "migrations/0004_refresh_tokens.sql:3 — user_id は ON DELETE CASCADE"
      - inspection: "app/routes/orders.py:9-19, app/routes/profile.py:9-16, migrations/0007_orders.sql:3, migrations/0012_audit_logs.sql:3 — 削除後のトークンでは読み取りが空、書き込み（注文作成・監査記録の挿入）は users を参照する外部キーで失敗する"
      - inspection: "migrations/0001_users.sql:2 と PostgreSQL 16 Documentation §8.1.4 Serial Types — bigserial は sequence から採番し、割り当てた値は使用済みになる"
    gap: "(1) 『ログインできない』が発行済みトークンの即時失効まで含むかは要求の文面で決まらない。(2) ログイン・トークン更新の実装が抜粋に無く、削除後にそれらが拒否されることを資料で確かめられない"
    resolution:
      action: investigate
      reason: "要求の範囲は PM、ログイン・更新の挙動は抜粋外のコードが根拠・証拠になる。猶予付き削除（S-02）や、注文を残して users 行を匿名化する形（S-01）になれば users 行や注文が残り、残ったトークンで読める・書けるものが変わるため、対応の選び方は S-01・S-02 待ち"
      candidate: true
    verification:
      status: pending
      plan: "(1) ログイン・トークン更新の実装を読み、users 行と refresh_tokens が無い利用者を拒むことを確認する。(2) PM に『ログインできない』の範囲（発行済みアクセストークンの最長24時間を許容するか）を確認し ACC-88 に記録する。(3) 即時失効が要るなら失効の仕組みを改修し、許容なら narrow して『新たなログインとトークン更新はできない。発行済みトークンは最長24時間で切れる』と説明する"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit: {limit: "削除後も発行済みアクセストークンは最長24時間有効。ログイン・更新処理が削除済み利用者を拒むことは未確認", revisit_condition: "ログイン・更新の実装を確認したとき、または PM が範囲を決めたとき", kind: unverified}
    depends_on: [S-01, S-02]

