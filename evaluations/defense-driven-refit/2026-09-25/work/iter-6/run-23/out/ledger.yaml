    depends_on: []

  - id: D-03
    scope: {ref: "app/webhooks.py:21-33", version: "sha256:7ae2763eb808ac952cc3ee8bd2d171cfab65561025da7135453e867c642f196f"}
    layer: 細部
    origin: [counterexample]
    question: "どう反証: 不正な署名ヘッダで 400 以外になる入力はあるか"
    current_answer: "解析に失敗した署名は False として 400 で拒否する"
    grounding:
      - requirement: "PAY-140 要求2「偽の webhook で状態を変えられないこと」（docs/tickets/PAY-140.md:6）"
    evidence:
