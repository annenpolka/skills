      - inspection: "hmac.compare_digest は str なら ASCII のみを受け付けると文書化されており、ASCII 以外を含む str では TypeError になる（公開の不具合報告による。実行はしていない）。比較は try の外なので 500 になる"
        ref: "app/webhooks.py:33; Python 文書 hmac.compare_digest"
      - inspection: "ヘッダ値は latin-1 で復号されるので、ASCII 以外の文字が届き得る"
        ref: "Starlette datastructures.Headers"
      - inspection: "どちらの例外も DB 処理より前で起きる"
        ref: "app/webhooks.py:39-41,46"
    gap: "ASCII 以外の文字を含む署名値では 400 ではなく 500 になる。状態は変わらない"
    resolution:
      action: narrow
      reason: "要求2（偽の webhook で状態を変えない）は満たしており、400 と 500 の区別は要求にも PayCo 抜粋にも無い。説明を「不正な署名は 2xx 以外で拒否し、状態を変えない」に限定する"
      candidate: false
    verification:
      status: done
      plan: "限定した説明が成り立つことをコードと文書で確かめる"
      result: "不正な署名の経路はすべて DB 処理より前で終わり、応答は 400 か 500 で 2xx にならない"
      artifact_version: "sha256:7ae2763eb808ac952cc3ee8bd2d171cfab65561025da7135453e867c642f196f"
    final_answer: "不正な署名は 2xx 以外で拒否し、状態は変えない。ASCII 以外の文字を含む署名値は 400 ではなく 500 になるが、要求と PayCo の契約の範囲では区別しない。"
    admitted_limit:
      limit: "ASCII 以外を含む不正な署名が 500 として記録される"
      revisit_condition: "5xx の監視にこの経路のノイズが乗るとき、または応答コードの規約が定まったとき（比較の前に bytes へ変換すれば 400 にできる）"
      kind: accepted
    depends_on: []

