  layer: 境界
  origin: deviation         # 隣接に DELETE ルートが無く、HTTP の標準形と比べた
  question: "なぜこの形: 204 No Content を返すのは何に基づくか"
  current_answer: 削除を実施済みで、返す情報が無いときの標準の応答
  grounding:
    - {convention: "RFC 9110 §9.3.5 DELETE『a 204 (No Content) status code if the action has been enacted and no further information is to be supplied』。未実施なら『202 (Accepted) ... if the action will likely succeed but has not yet been enacted』"}
  evidence:
    - {inspection: "app/routes/account.py:9,12 DELETE の直後に 204 を返す"}
