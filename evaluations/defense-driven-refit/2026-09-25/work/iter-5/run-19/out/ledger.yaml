- id: D-08
  scope: {ref: "migrations/0042_add_failure_count.sql:1", version: "sha256:7f583c5699d3"}
  layer: 境界
  origin: impact            # 移行・後方互換 / DBマイグレーション
  question: "どの前提を焼き込んでいる: 適用中・適用後・ロールバック後に、旧版アプリと月額ジョブが動き続けられる前提"
  current_answer: "subscriptions に failure_count を NOT NULL DEFAULT 0 で加える"
  grounding:
    - existing_contract: "deploy/README.md:4-5 — マイグレーションは pre-deploy Job で適用し、成功後に RollingUpdate。ロールバックはイメージのみで、マイグレーションは戻さない"
    - requirement: "BILL-212 要求3（連続失敗回数を数える）"
  evidence:
    - inspection: "PostgreSQL 16 docs, ALTER TABLE『Notes』: non-volatile な DEFAULT 付きの ADD COLUMN は既定値をメタデータに保存し、表の書き換えを要しない（deploy/README.md:3 で PostgreSQL 16）"
    - inspection: "app/monthly_worker.py:12-39 — failure_count を読み書きしない。加算のみの変更で既存の列・制約は変えていない"
  gap: null
  resolution: null
  verification:
    status: done
    plan: "資料確認"
    result: "加算のみで既存の読み書きに影響しない。PG16 では表の書き換えが無い。ロールバックで列が残っても旧版は参照しない"
    artifact_version: "sha256:7f583c5699d3"
  final_answer: "列を足すだけで、月額ジョブも旧版アプリもこの列を読まないので、先にマイグレーション・後でアプリという順でも、アプリだけ戻した後でも動く。PostgreSQL 16 では既定値付きの列追加は表を書き換えない。"
  admitted_limit:
    limit: "ADD COLUMN は ACCESS EXCLUSIVE ロックを取る（PostgreSQL 16 docs, ALTER TABLE『Description』）。subscriptions に長時間のクエリがあると適用が待たされ、その間は後続の読み書きも待ちうる。ロック待ちは計測していない"
    revisit_condition: "適用する時間帯に subscriptions への長時間クエリがあると分かったとき"
  depends_on: []

