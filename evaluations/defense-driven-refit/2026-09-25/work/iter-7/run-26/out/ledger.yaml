  - id: D-005
    scope: {ref: "app/renewal_worker.py:5,26,28-31; app/config.py:3", version: "sha256:4f30341995ac"}
    layer: 細部
    origin: [deviation, impact]
    question: "なぜこの形: 請求額を、月額が使う money.with_tax_minor_units ではなく round(price * (1 + TAX_RATE), 2) で計算するのはなぜか"
    current_answer: "config の TAX_RATE で税込にし、小数2桁に丸める（app/renewal_worker.py:26）"
    grounding:
      - {kind: requirement, ref: "docs/tickets/BILL-212.md:12", says: "要求4: 請求額は税込。通貨ごとの最小単位に丸める（JPY は1円、USD は1セント）"}
      - {kind: existing_contract, ref: "docs/vendor/payco-api-v2-excerpt.md:7", says: "amount は通貨の最小単位の整数（JPY なら円、USD ならセント）"}
      - {kind: existing_contract, ref: "app/money.py:7-11; app/monthly_worker.py:21", says: "税込額を最小単位の整数で返す既存関数（ROUND_HALF_UP）を月額が使っている"}
    evidence:
      - {kind: inspection, ref: "migrations/0031_subscriptions.sql:6; app/db.py:1-6", observation: "price は numeric(12,2)。psycopg 3 に dict_row だけを指定し、型の読み替え設定は無い"}
      - {kind: inspection, ref: "psycopg 3 documentation, Adapting basic Python types（数値の節）", observation: "numeric は既定で Python の Decimal として返る"}
      - {kind: inspection, ref: "app/config.py:3; Python documentation, decimal — Decimal objects", observation: "TAX_RATE は float の 0.10。Decimal と float の算術は TypeError になる。:26 の例外は PaymentError ではないので :34 で捕まらない"}
      - {kind: inspection, ref: "app/renewal_worker.py:26,30", observation: "float で計算できたとしても round(…, 2) は小数を含む float で、USD はドル単位（PayCo はセント）で送られ、JPY は1円単位に丸まらない"}
      - {kind: inspection, ref: "tests/test_renewal_worker.py:41,59", observation: "fixture の price は float の 12000.0、断言は 13200.0。本番の Decimal 経路を通っていない"}
    gap: "本番の型（numeric→Decimal）では金額計算が TypeError になり、1件も更新課金できない。型が合っても PayCo の金額契約（最小単位の整数）と要求4に反し、USD は100分の1の額を請求する"
    resolution:
      action: remove_or_align
      reason: "要求4をそのまま実装している既存の money.with_tax_minor_units(price, currency) に寄せる（月額と同じ）"
