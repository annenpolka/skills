      plan: "Decimal の price（JPY 12000.00、USD 10.00、端数が出る値、ROUND_HALF_UP の境界値）で amount が int かつ通貨の最小単位であることを単体テストで確認し、float の fixture と 13200.0 の断言を置き換える"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit:
