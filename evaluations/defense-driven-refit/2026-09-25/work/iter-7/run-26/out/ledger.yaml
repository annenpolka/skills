  - id: D-003
    scope: {ref: "app/renewal_worker.py:27-36; app/payments_client.py:17-31", version: "sha256:4f30341995ac"}
    layer: 手続き
    origin: [impact, counterexample, asked]
    simulated: true
    question: "どう反証: 「課金に失敗したら3日後に再試行」に従ったまま、すでに成立した課金をもう一度行う経路は無いか（二重課金しないことはどこで保証しているか）"
    current_answer: "PaymentError はすべて失敗として数え、renews_at を3日後にして次回また課金する（app/renewal_worker.py:34-36,55-58）"
    grounding:
      - {kind: requirement, ref: "docs/tickets/BILL-212.md:10", says: "要求2: 同じ購読の同じ請求期間について二重に課金しない"}
      - {kind: existing_contract, ref: "docs/vendor/payco-api-v2-excerpt.md:8", says: "Idempotency-Key ヘッダを受け付け、同じキーでの再送には最初の要求の結果を返す"}
      - {kind: convention, ref: "Kubernetes Documentation, CronJob — CronJob limitations", says: "there are certain circumstances where two Jobs might be created, or no Job might be created ... Therefore, Jobs should be idempotent.（D-001 で CronJob に寄せる前提での規範）"}
    evidence:
      - {kind: inspection, ref: "docs/vendor/payco-api-v2-excerpt.md:10", observation: "5xx では課金の成否が不定のことがある"}
      - {kind: inspection, ref: "app/payments_client.py:30,36-43", observation: "Idempotency-Key を送らない。5xx が続くと PaymentError を投げ、呼び出し側は失敗と区別できない"}
      - {kind: inspection, ref: "app/renewal_worker.py:34-36,55-58", observation: "失敗扱いにすると3日後に同じ購読を再課金する。課金済みかの照会（GET /v2/charges）は使っていない"}
    gap: "5xx で結果が不定のまま失敗と数え、3日後に冪等キー無しで再課金するため、最初の要求が成立していれば同じ請求期間に二重課金になる（要求2違反）"
    resolution:
      action: change
      reason: "購読IDと請求期間から一意に決まる Idempotency-Key を charge に付け、同じ期間の再送に PayCo が最初の結果を返すようにする。キーの元にする請求期間の識別子は、再試行で renews_at を上書きする現行設計では定まらないため、D-007 の確定を待つ"
      candidate: true
    verification:
      status: pending
      plan: "クライアントの単体テストで (1) Idempotency-Key ヘッダが付く (2) 同じ購読・同じ請求期間なら再試行をまたいでも同じキーになる (3) 次の期間では別のキーになる、を確認する"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit:
      limit: "冪等キーで畳めるのは PayCo がキーを保持している間だけ。保持期間は転記元に記載が無く（SUP-4411 で問い合わせ中）、3日後の再試行がその内側かは不明（D-021）"
      revisit_condition: "SUP-4411 の回答が届いたとき"
      kind: unverified
      accepted_by: null
    depends_on: [D-007]

