  # 入口: 影響駆動（並行実行、課金に触れる計算）＋反例駆動（説明「席数を超える招待を409で拒否」に従えてしまう実装）。
  # 数えてから INSERT する形は退屈版と一致している。
  - id: D-011
    scope: {ref: "app/routes/invitations.py:16-33", version: "sha256:48e8e2f41ff05774c4cc9f4bb4c46708bc4d543e20d05c373d5ed921dcf869cc"}
    layer: 手続き
    origin: [impact, counterexample]
    question: "どう反証: 残り1席のとき、同じ組織の招待要求が2件同時に届いたら"
    current_answer: "同じトランザクションの中で、有効メンバー数と未承諾招待数を数え、上限未満なら INSERT する"
    grounding:
      - requirement: "docs/tickets/TEAM-45.md:6 — プランの席数を超えてメンバーを招待できないようにする"
      - existing_contract: "deploy/README.md:3 — DB は PostgreSQL 16。既定のトランザクション分離レベルは変更していない"
      - existing_contract: "PostgreSQL 16 文書 13.3.2 Row-Level Locks（FOR UPDATE で取得した行は、他トランザクションの UPDATE・DELETE・SELECT FOR UPDATE 等をトランザクション終了までブロックする）と SELECT 文書『The Locking Clause』（表を指定すればその表の行だけをロックし、指定しなければ文中の全表をロックする）— 改修方式を選ぶ理由として使う"
    evidence:
      - inspection: "app/routes/invitations.py:16-33 — 数えてから INSERT するまでの間に、行ロックも一意制約も無い"
      - inspection: "PostgreSQL 16 文書 13.2・13.2.1 Read Committed Isolation Level — 既定の分離レベルは Read Committed。FOR UPDATE/SHARE の無い SELECT はクエリ開始前にコミット済みのデータだけを見る"
      - inspection: "deploy/api.yaml:6,15 — 3レプリカ×4ワーカーで要求を並行に処理する"
      - inspection: "tests/test_invitations.py:7-20 — トランザクションを偽物に差し替えており、並行実行もSQLも検査していない（未実行）"
    gap: "2つのトランザクションがどちらも使用数＝上限−1を読み、どちらも INSERT してコミットできる。席数を超える招待が成立し、要求2に反する。2人の管理者の同時操作や二重送信で到達する（一括招待画面が並行に呼ぶかは資料で分からない）"
    resolution:
      action: change
      reason: "数える前に組織の行を FOR UPDATE OF o でロックし、同じ組織の招待をトランザクション単位で直列化する。OF o に限るのは、plans の行までロックすると同じプランの全組織が直列化するため。分離レベルの変更や新しい仕組みは足さない"
      candidate: false
    verification:
      status: pending
      plan: "実DBで2接続から同時に招待する結合テストで、上限を超えないことと、後から来た方が 409 になることを確かめる（次周、strength=テスト実行）"
      result: null
      artifact_version: null
    final_answer: null
    admitted_limit:
      limit: "ロックはトランザクション終了まで保持され、現状はその間にロゴ取得とメール送信（外部通信）が入るため、同じ組織の招待がその時間だけ待つ。席を消費する他の経路（メンバーの再有効化など）が資料に無く、同じロックを取るか未確認"
      revisit_condition: "D-012・D-013 の resolution が確定したとき、および席を消費する他の経路を洗い出したとき"
      kind: unverified
      accepted_by: null
    depends_on: []

