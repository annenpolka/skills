# 定期ジョブ起動プロセス。可用性のため2レプリカで動かす（INFRA-77）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing-scheduler
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
  template:
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: scheduler
          image: registry.internal/billing:{{ .Values.tag }}
          command: ["python", "-m", "app.scheduler"]
          env:
            - name: TZ
              value: Asia/Tokyo
