# 月額更新ジョブ。単独プロセス（replicas: 1）で cron 起動。
apiVersion: batch/v1
kind: CronJob
metadata:
  name: billing-monthly-worker
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: monthly
              image: registry.internal/billing:{{ .Values.tag }}
              command: ["python", "-c", "from app.monthly_worker import run_due_monthly; run_due_monthly()"]
