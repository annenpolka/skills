apiVersion: apps/v1
kind: Deployment
metadata:
  name: team-api
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  template:
    spec:
      containers:
        - name: api
          image: registry.internal/team-api:{{ .Values.tag }}
          command: ["uvicorn", "app.main:app", "--workers", "4"]
